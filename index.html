<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="AI 기술을 쉽고 깊이 있게 전하는 NeuralPulse 블로그" />
  <title>NeuralPulse | AI 기술 블로그</title>
  <style>
    :root{color-scheme:dark;--bg:#050505;--card:#0d0d11;--text:#f8f7fb;--muted:#9d98aa;--line:#24212b;--violet:#a855f7;--pink:#e954ff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
    header{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo span,.accent{background:linear-gradient(120deg,var(--violet),var(--pink));background-clip:text;color:transparent}.links{display:flex;gap:28px;color:#c7c2ce}.links a:hover,.links a.active{color:#fff}.subscribe{border:1px solid var(--violet);border-radius:8px;padding:9px 17px;color:#d99cff}
    .hero{padding:90px 0 70px;background:radial-gradient(circle at 76% 22%,rgba(132,45,255,.22),transparent 28%)}.eyebrow{color:#bd69ff;font-weight:700}.hero h1{font-size:clamp(42px,7vw,82px);line-height:1.05;letter-spacing:-4px;margin:14px 0 24px;max-width:900px}.hero p{font-size:19px;color:var(--muted);max-width:680px}.cta{display:inline-block;margin-top:22px;padding:12px 20px;border-radius:8px;background:linear-gradient(120deg,#7c3aed,#c026d3);font-weight:800}
    main{padding:54px 0 90px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.section-head h2{font-size:34px;margin:0;letter-spacing:-1.5px}.section-head p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 24px}.card{display:block}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#17151e;border:1px solid var(--line);transition:.25s}.card:hover .thumb{transform:translateY(-3px);border-color:#7c3aed}.meta{margin-top:12px;color:#bd56ff;font-size:13px}.card h3{font-size:18px;line-height:1.4;margin:6px 0}.card p{color:var(--muted);margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.date{display:block;color:#777181;font-size:12px;margin-top:10px}
    .article{max-width:820px;margin:auto}.back{display:inline-block;color:#aaa4b2;margin-bottom:28px}.article .category{color:#c056ff;font-weight:700}.article h1{font-size:clamp(38px,6vw,64px);line-height:1.08;letter-spacing:-3px;margin:10px 0 18px}.byline{color:#a9a3b4;margin-bottom:32px}.cover{width:100%;max-height:540px;object-fit:cover;border-radius:12px;margin-bottom:34px}.body{font-size:18px;color:#d7d3dc}.body h2{color:#fff;font-size:28px;margin:48px 0 12px;letter-spacing:-1px}.body p{margin:0 0 20px}.body ul{padding-left:22px}.related{margin-top:70px;padding-top:38px;border-top:1px solid var(--line)}.related h2{font-size:28px}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.mini{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.mini small{color:#b954f5}.mini strong{display:block;margin-top:6px;line-height:1.4}
    footer{border-top:1px solid var(--line);padding:34px 0;color:#777181}.footer{display:flex;justify-content:space-between}.empty{text-align:center;color:var(--muted);padding:80px 0}
    @media(max-width:820px){.links{display:none}.hero{padding:62px 0}.hero h1{letter-spacing:-2px}.grid{grid-template-columns:repeat(2,1fr)}.related-grid{grid-template-columns:1fr}.article h1{letter-spacing:-2px}}
    @media(max-width:560px){.wrap{width:min(100% - 28px,1180px)}.grid{grid-template-columns:1fr}.section-head{display:block}.section-head p{margin-top:8px}.footer{display:block}.subscribe{font-size:13px}.article .body{font-size:16px}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><a class="logo" href="#home">Neural<span>Pulse</span></a><nav class="links"><a href="#home">홈</a><a href="#posts">아티클</a><a href="#posts">토픽</a><a href="#about">소개</a></nav><a class="subscribe" href="mailto:hello@neuralpulse.example">구독하기</a></div></header>
  <div id="app"></div>
  <footer><div class="wrap footer"><span>NeuralPulse — 인간을 위한 AI 기술 이야기</span><span>© 2026 NeuralPulse</span></div></footer>
  <script>
    const posts=[
      {slug:'prompt-engineering-guide',title:'좋은 답변을 이끄는 프롬프트 엔지니어링',description:'AI에게 원하는 결과를 명확하게 전달하기 위한 프롬프트의 구조와 실전 개선 방법을 알아봅니다.',date:'2026년 8월 13일',author:'김프롬프트',category:'생성형 AI',image:'public/images/ai-lab.jpg',related:['generative-ai-next','ai-agents-work','responsible-ai'],body:`<p>프롬프트 엔지니어링은 단순히 AI에게 질문을 잘하는 기술이 아닙니다. 필요한 맥락과 조건을 구조화해 원하는 결과에 더 가까이 가는 협업 방식입니다.</p><p>같은 모델을 사용해도 요청의 구체성, 예시, 평가 기준에 따라 결과의 품질은 크게 달라집니다.</p><h2>좋은 프롬프트의 네 가지 요소</h2><ul><li><strong>역할:</strong> AI가 어떤 관점에서 답할지 지정합니다.</li><li><strong>작업:</strong> 수행해야 할 일을 동사로 명확히 씁니다.</li><li><strong>맥락:</strong> 대상 독자와 목적, 배경을 알려 줍니다.</li><li><strong>출력 형식:</strong> 길이, 구조, 말투를 지정합니다.</li></ul><p>예를 들어 “마케팅 전문가로서 초보 창업자를 위한 AI 서비스 소개문을 300자 이내, 친근한 한국어로 작성해 줘”처럼 요청할 수 있습니다.</p><h2>작업을 한 번에 모두 요청하지 않기</h2><p>복잡한 업무는 조사, 초안, 검토, 수정 단계로 나누는 편이 안정적입니다. 각 단계의 결과를 확인한 뒤 다음 요청에 반영하면 오류를 일찍 발견할 수 있습니다.</p><h2>예시와 평가 기준 제공하기</h2><p>원하는 결과의 예시를 보여 주고 정확성, 간결성, 대상 독자 적합성 같은 평가 기준을 제시하세요. AI가 무엇을 좋은 답변으로 판단해야 하는지 분명해집니다.</p><h2>첫 번째 답변을 최종 결과로 보지 않기</h2><p>첫 답변은 완성품보다 대화의 출발점에 가깝습니다. 빠진 내용, 바꿀 말투, 더 깊게 다룰 부분을 구체적으로 알려 주며 반복해서 개선하세요.</p><h2>AI와 협업하는 습관</h2><p>좋은 프롬프트는 완벽한 한 문장이 아니라 목적을 공유하고 결과를 함께 다듬는 과정입니다. 중요한 사실과 판단은 반드시 사람이 다시 확인해야 합니다.</p>`},
      {slug:'generative-ai-next',title:'생성형 AI, 다음 인터페이스가 되다',description:'대화형 AI가 검색과 소프트웨어의 경계를 어떻게 다시 그리고 있는지 살펴봅니다.',date:'2026년 8월 12일',author:'김뉴럴',category:'생성형 AI',image:'public/images/robot-ai.jpg',related:['prompt-engineering-guide','computer-vision-world','small-models'],body:`<p>생성형 AI는 별도의 도구를 넘어 우리가 소프트웨어와 만나는 새로운 인터페이스가 되고 있습니다. 사용자는 메뉴를 찾는 대신 원하는 결과를 자연어로 설명합니다.</p><h2>명령에서 의도로</h2><p>기존 소프트웨어는 정해진 기능과 순서를 학습해야 했습니다. 대화형 AI는 사용자의 의도를 파악해 여러 단계를 하나의 흐름으로 연결합니다.</p><h2>더 작고 개인적인 AI</h2><p>소형 모델과 온디바이스 기술은 개인 정보가 기기 밖으로 나가지 않으면서도 빠른 개인화 경험을 가능하게 합니다.</p><h2>사람을 중심에 두는 설계</h2><p>AI가 더 많은 결정을 돕게 될수록 근거를 설명하고, 사용자가 수정하거나 거부할 수 있는 설계가 중요해집니다.</p>`},
      {slug:'computer-vision-world',title:'컴퓨터 비전은 세계를 어떻게 읽는가',description:'픽셀에서 의미를 발견하는 시각 AI의 핵심 원리와 실제 활용 사례를 정리합니다.',date:'2026년 8월 8일',author:'이비전',category:'컴퓨터 비전',image:'public/images/neural-network.jpg',related:['generative-ai-next','responsible-ai'],body:`<p>컴퓨터 비전은 이미지와 영상 속 패턴을 찾아 사물, 사람, 장면의 의미를 이해하는 AI 분야입니다.</p><h2>픽셀에서 특징으로</h2><p>모델은 색과 밝기 같은 작은 정보에서 시작해 모서리, 질감, 형태를 단계적으로 학습합니다.</p><h2>멀티모달의 시대</h2><p>이미지와 언어를 함께 이해하는 모델은 사진을 설명하고 질문에 답하며 시각 자료를 검색 가능한 지식으로 바꿉니다.</p><h2>현실 세계의 책임</h2><p>의료, 교통, 보안처럼 중요한 분야에서는 다양한 환경의 데이터와 사람의 검토 절차가 반드시 필요합니다.</p>`},
      {slug:'small-models',title:'작은 모델이 만드는 더 큰 변화',description:'효율적인 소형 언어 모델이 온디바이스 AI와 개인화 시장을 넓히는 이유입니다.',date:'2026년 8월 3일',author:'박모델',category:'머신러닝',image:'public/images/machine-learning.jpg',related:['generative-ai-next','ai-agents-work'],body:`<p>모든 문제에 가장 큰 AI 모델이 필요한 것은 아닙니다. 특정 작업에 최적화한 작은 모델은 비용과 속도, 개인 정보 보호에서 강점을 보입니다.</p><h2>필요한 만큼의 지능</h2><p>범위가 분명한 고객 지원, 문서 분류, 요약 작업에서는 소형 모델도 충분히 높은 품질을 낼 수 있습니다.</p><h2>기기 안에서 실행하기</h2><p>휴대전화나 노트북에서 직접 실행하면 응답이 빠르고 민감한 데이터 전송을 줄일 수 있습니다.</p>`},
      {slug:'responsible-ai',title:'책임 있는 AI를 위한 네 가지 질문',description:'모델을 배포하기 전에 팀이 반드시 확인해야 할 안전성과 투명성의 기준입니다.',date:'2026년 7월 27일',author:'최세이프',category:'AI 윤리',image:'public/images/robot-future.jpg',related:['computer-vision-world','ai-agents-work'],body:`<p>책임 있는 AI는 선언이 아니라 제품을 설계하고 운영하는 구체적인 질문과 절차에서 시작합니다.</p><h2>누구에게 영향을 주는가</h2><p>평균적인 사용자뿐 아니라 오류로 더 큰 피해를 볼 수 있는 사람과 예외 상황을 함께 살펴야 합니다.</p><h2>실패를 발견할 수 있는가</h2><p>정확도 하나만 보지 말고 실제 운영 환경에서 오류를 기록하고 알릴 수 있는 관찰 장치를 마련해야 합니다.</p><h2>사람이 개입할 수 있는가</h2><p>중요한 결정에는 사람이 검토하고 AI의 결정을 취소하거나 수정할 수 있는 경로가 필요합니다.</p>`},
      {slug:'ai-agents-work',title:'AI 에이전트와 일하는 새로운 방법',description:'반복 작업을 맡기는 것에서 시작해 인간과 AI가 역할을 나누는 방식을 제안합니다.',date:'2026년 7월 19일',author:'정에이전트',category:'생성형 AI',image:'public/images/ai-lab.jpg',related:['prompt-engineering-guide','generative-ai-next','small-models'],body:`<p>AI 에이전트는 목표를 받아 여러 도구와 단계를 연결해 업무를 수행합니다. 효과적인 도입은 사람을 대체하기보다 역할을 명확히 나누는 데서 시작합니다.</p><h2>작은 업무부터 시작하기</h2><p>결과를 쉽게 검토할 수 있는 반복 업무부터 맡기면 위험을 낮추면서 실제 효과를 확인할 수 있습니다.</p><h2>경계와 권한 설계</h2><p>읽기, 작성, 전송, 삭제 권한을 구분하고 외부에 영향을 주는 행동에는 사람의 승인을 두어야 합니다.</p><h2>협업의 기록</h2><p>에이전트가 어떤 정보와 판단으로 행동했는지 기록하면 오류를 재현하고 업무 방식을 지속적으로 개선할 수 있습니다.</p>`}
    ];
    const app=document.querySelector('#app');
    const card=p=>`<a class="card" href="#post/${p.slug}"><img class="thumb" src="${p.image}" alt="${p.title}"/><div class="meta">✣ ${p.category}</div><h3>${p.title}</h3><p>${p.description}</p><span class="date">◷ ${p.date}</span></a>`;
    function home(){return `<section class="hero"><div class="wrap"><div class="eyebrow">AI · PEOPLE · FUTURE</div><h1>인공지능의 오늘을 읽고,<br><span class="accent">내일을 설계합니다.</span></h1><p>빠르게 변하는 AI 기술을 이해하기 쉬운 한국어로 전합니다. 기술의 원리부터 일과 삶의 변화까지 함께 살펴보세요.</p><a class="cta" href="#posts">모든 글 보기 →</a></div></section><main><div class="wrap"><div class="section-head"><h2>최신 포스팅</h2><p>새로운 AI 인사이트를 만나보세요.</p></div><div class="grid">${posts.slice(0,3).map(card).join('')}</div></div></main>`}
    function list(){return `<main><div class="wrap"><div class="section-head"><h2>전체 포스팅</h2><p>총 ${posts.length}개의 글</p></div><div class="grid">${posts.map(card).join('')}</div></div></main>`}
    function article(slug){const p=posts.find(x=>x.slug===slug);if(!p)return `<main class="wrap empty">글을 찾을 수 없습니다. <a class="accent" href="#posts">목록으로 돌아가기</a></main>`;const rel=p.related.map(s=>posts.find(x=>x.slug===s)).filter(Boolean);return `<main><article class="article wrap"><a class="back" href="#posts">← 전체 포스팅으로</a><div class="category">✣ ${p.category}</div><h1>${p.title}</h1><div class="byline">◷ 약 ${Math.max(3,Math.ceil(p.body.replace(/<[^>]+>/g,'').length/450))}분 · ${p.date} · ${p.author}</div><img class="cover" src="${p.image}" alt="${p.title}"/><div class="body">${p.body}</div><section class="related"><h2>연관 포스팅</h2><div class="related-grid">${rel.map(x=>`<a class="mini" href="#post/${x.slug}"><small>${x.category}</small><strong>${x.title}</strong></a>`).join('')}</div></section></article></main>`}
    function render(){const route=location.hash.slice(1)||'home';app.innerHTML=route==='posts'?list():route.startsWith('post/')?article(route.split('/')[1]):home();document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+route));scrollTo(0,0)}
    addEventListener('hashchange',render);render();
  </script>
</body>
</html>
